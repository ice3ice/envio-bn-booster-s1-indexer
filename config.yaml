name: zkpass-bn-booster-s1-indexer
description: zkPass Binance Booster S1 indexer
#Global contract definitions that must contain all definitions except
#addresses. Now you can share a single handler/abi/event definitions
#for contracts across multiple chains
contracts:
  - name: RewardVault
    abi_file_path: ./abis/reward-vault-abi.json
    handler: ./src/RewardVaultEventHandlers.js
    events:
      - event: RewardsClaimed(uint256 indexed claimId, uint256 indexed projectId, address token, uint256 amount, address recipient, uint256 expireTime)
      - event: RewardsClaimedV2(uint256[] claimId, uint256[] projectId, address[] token, uint256[] totalAmount, address recipient, uint256 expireTime)
rollback_on_reorg: false
networks:
  - id: 56 # BSC
    start_block: 42177208
    contracts:
      - name: RewardVault
        address: "0x317Cd61fa24e2E4068b4C47Bd58D5fC9f4E7A12b"
field_selection:
  transaction_fields:
    - "hash"
    - "transactionIndex"