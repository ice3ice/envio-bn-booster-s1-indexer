type UserClaim {
  id: String! # (address + token)
  recipient: String! # address
  projectId: BigInt!
  token: String!
  amount: BigInt!
  claimCount: BigInt!
  blockTimestamp: BigInt!
}

type UserClaimStats {
   id: String! # address
   tokens: [String!]!
   claimCount: BigInt!
   blockTimestamp: BigInt!
}

type TokenToProjectId {
  id: String!
  token: String!
  projectId: BigInt!
}