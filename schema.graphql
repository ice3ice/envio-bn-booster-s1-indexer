type Claim {
  id: ID!
  claimId: [BigInt!]!
  projectId: [BigInt!]!
  token: [String!]!
  totalAmount: [BigInt!]!
  recipient: String!
  expireTime: BigInt!
  blockTimestamp: BigInt!
}

type Stats {
  id: ID!
  claimCount: BigInt!
  projectCount: BigInt!
  tokenCount: BigInt!
  totalAmountCount: BigInt!
  blockTimestamp: BigInt!
}

type Specific {
  id: ID!
  claimId: [BigInt!]!
  projectId: [BigInt!]!
  token: [String!]!
  totalAmount: [BigInt!]!
  recipient: String!
  blockTimestamp: BigInt!
}